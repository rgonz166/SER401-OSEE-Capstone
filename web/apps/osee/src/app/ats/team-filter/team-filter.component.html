<mat-form-field
	appearance="outline"
	subscriptSizing="dynamic">
	<mat-label>Team</mat-label>
	<mat-select
		id="team-filter"
		multiple
		[value]="selected()"
		(selectionChange)="setTeam($event)">
		@for (person of teamMembers; track person) {
			<mat-option [value]="person">{{ person }}</mat-option>
		}
	</mat-select>
</mat-form-field>
