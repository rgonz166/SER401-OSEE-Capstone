<mat-form-field appearance="outline" subscriptSizing="dynamic">
	<mat-label>Assignees</mat-label>
	<mat-select
		multiple
		[value]="selectedAssigneeIds()"
		(selectionChange)="selectedAssigneeIds.set($event.value)">
		@for (option of options(); track option.id) {
			<mat-option [value]="option.id">{{ option.name }}</mat-option>
		} @empty {
			<mat-option disabled>{{ loading() ? 'Loading options...' : 'No options available' }}</mat-option>
		}
	</mat-select>
</mat-form-field>
@if (selectedAssigneeIds().length > 0) {
	<button mat-stroked-button type="button" (click)="selectedAssigneeIds.set([])">
		Clear
	</button>
}
@if (error()) {
	<p role="alert" class="tw-p-4 tw-text-sm tw-opacity-50">{{ error() }}</p>
}
